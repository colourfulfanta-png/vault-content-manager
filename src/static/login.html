<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vault · 登录</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="login.css">
</head>
<body class="theme-dark">
<div class="login-wrap">

  <!-- 登录 / 注册 -->
  <form class="login-card" id="loginForm">
    <h1 id="brandTitle">🔐 Vault</h1>
    <div class="sub" id="brandSub">个人密码与资产保管库</div>
    <label>用户名</label>
    <input id="user" autocomplete="username">
    <label>主密码</label>
    <input id="pass" type="password" autocomplete="current-password">
    <div id="confirmWrap" hidden>
      <label>确认主密码</label>
      <input id="pass2" type="password" autocomplete="new-password">
    </div>
    <label class="row" style="gap:8px;margin:12px 0 0;color:var(--text)">
      <input type="checkbox" id="regMode"> <span>创建新账号（自动检测，可手动纠正）</span>
    </label>
    <button class="btn btn-primary" type="submit">解锁</button>
    <div class="login-tip" id="tip">输入用户名和主密码登录；不存在的用户名会自动切换为创建账号模式</div>
    <div style="text-align:center;margin-top:10px">
      <a href="#" id="forgotLink" style="color:var(--primary);font-size:13px;text-decoration:none">忘记主密码？用恢复码找回</a>
    </div>
  </form>

  <!-- 忘记主密码：恢复码找回 -->
  <div class="login-card" id="recoverPanel" hidden>
    <h1>🔑 恢复码找回</h1>
    <div class="sub">用保存过的恢复码重设主密码，数据会用新密码重新加密</div>
    <label>用户名</label>
    <input id="rUser" autocomplete="username">
    <label>恢复码</label>
    <input id="rCode" autocomplete="off" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XXXX">
    <label>新主密码（至少 6 位）</label>
    <input id="rPass" type="password" autocomplete="new-password">
    <label>确认新主密码</label>
    <input id="rPass2" type="password" autocomplete="new-password">
    <button class="btn btn-primary" id="rSubmit" type="button">重置主密码</button>
    <div class="login-tip" id="rTip"></div>
    <div style="text-align:center;margin-top:10px">
      <a href="#" id="rBack" style="color:var(--primary);font-size:13px;text-decoration:none">返回登录</a>
    </div>
  </div>

  <!-- 恢复码展示（注册后 / 找回重置后 / 旧版升级后） -->
  <div class="login-card" id="codePanel" hidden>
    <h1>🔑 你的恢复码</h1>
    <div class="sub" id="codeNote"></div>
    <div id="newCode" style="font-size:19px;letter-spacing:2px;text-align:center;padding:14px 0;font-weight:700;user-select:all"></div>
    <div class="row" style="gap:10px;justify-content:center">
      <button class="btn btn-sm" id="codeCopy" type="button">复制</button>
      <button class="btn btn-sm" id="codeDownload" type="button">下载 .txt</button>
    </div>
    <label class="row" style="gap:8px;justify-content:center;margin-top:14px">
      <input type="checkbox" id="codeSaved"> <span>我已保存好恢复码</span>
    </label>
    <button class="btn btn-primary" id="codeContinue" type="button" disabled>继续</button>
  </div>

</div>
<script src="crypto.js"></script>
<script src="bg.js"></script>
<script src="login.js"></script>
</body>
</html>
